  }
</style>
<script>
  (function() {
    const sequence = [
      "INITIALIZING SECURE HANDSHAKE...",
      "Connecting via HTTPS...",
      "Resolving host vectors...",
      "Retrieving certificate...",
      "Validating SSL chain of trust...",
      "Reading metadata...",
      "Analyzing cryptographic signatures...",
      "Cross-referencing threat database..."
    ];
    
    const outputContainer = document.getElementById('typewriter-output');
    let currentIndex = 0;

    function renderNextLine() {
      if (currentIndex >= sequence.length) {
        // Reset and loop for the infinite loading vibe
        setTimeout(() => {
          outputContainer.innerHTML = '';
          currentIndex = 0;
          renderNextLine();
        }, 3000);
        return;
      }

      const lineWrapper = document.createElement('div');
      lineWrapper.className = 'flex items-start gap-md opacity-0 transform translate-y-2 transition-all duration-300 ease-out';
      
      const timestamp = new Date().toISOString().split('T')[1].slice(0, 12);
      
      lineWrapper.innerHTML = `
        <span class="text-on-surface-variant/50 shrink-0">[${timestamp}]</span>
        <span class="text-secondary shadow-secondary drop-shadow-[0_0_2px_rgba(93,230,255,0.8)]">${sequence[currentIndex]}</span>
      `;
      
      outputContainer.appendChild(lineWrapper);
      
      // Trigger reflow to play CSS transition
      void lineWrapper.offsetWidth;
      lineWrapper.classList.remove('opacity-0', 'translate-y-2');
      
      // Auto-scroll logic if container overfills
      if (outputContainer.children.length > 5) {
        const firstChild = outputContainer.firstElementChild;
        firstChild.style.opacity = '0';
        firstChild.style.height = '0';
        firstChild.style.margin = '0';
        firstChild.style.overflow = 'hidden';
        setTimeout(() => firstChild.remove(), 300);
      }

      currentIndex++;
      
      // Variable typing speed simulating variable processing time
      const delay = Math.random() * 800 + 400; 
      setTimeout(renderNextLine, delay);
    }

    // Start sequence
    setTimeout(renderNextLine, 600);
  })();
